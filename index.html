<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
  />
  <meta name="theme-color" content="#0b0708" />

  <title>for you 🌹</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>

    /* ============================================================
       DESIGN SETTINGS
    ============================================================ */

    :root {
      --rose-liquid: #E1476A;
      --rose-deep: #B22F4E;
      --rose-highlight: #FFD9DE;

      --ink-black: #0B0708;
      --warm-white: #FBEAE7;

      --font-display: 'Cormorant Garamond', serif;
      --font-body: 'Jost', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;

      overflow: hidden;

      background: var(--ink-black);

      font-family: var(--font-body);

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }


    /* ============================================================
       STAGES
    ============================================================ */

    .stage {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      display: none;
    }

    .stage.active {
      display: block;
    }


    /* ============================================================
       SCENE 1
       PARTICLE COUNTDOWN
    ============================================================ */

    #stage-intro {
      background: var(--ink-black);
    }

    #countdown-canvas {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;
    }

    .countdown-glow {
      position: absolute;

      inset: 0;

      pointer-events: none;

      background:

        radial-gradient(
          circle at 50% 50%,
          rgba(225,71,106,0.16),
          transparent 38%
        );
    }


    /* ============================================================
       SCENE 2
       PASSWORD
    ============================================================ */

    #stage-password {

      background:

        radial-gradient(
          circle at 50% 40%,
          #ef5d7d,
          var(--rose-liquid) 55%,
          var(--rose-deep)
        );

      align-items: center;

      justify-content: center;

      transition:
        background 1.2s ease;
    }

    #stage-password.active {
      display: flex;
    }

    #stage-password.unlocking {
      background: var(--ink-black);
    }


    /* PARTICLES */

    .particle {

      position: absolute;

      bottom: -10%;

      border-radius: 50%;

      background:
        rgba(255,255,255,0.7);

      pointer-events: none;

      animation:
        float-particle linear infinite;
    }

    @keyframes float-particle {

      0% {

        transform:
          translateY(0);

        opacity: 0;
      }

      15% {

        opacity: 1;
      }

      85% {

        opacity: 1;
      }

      100% {

        transform:
          translateY(-130px)
          translateX(var(--drift));

        opacity: 0;
      }

    }


    /* PASSWORD CARD */

    .password-card {

      position: relative;

      z-index: 5;

      width: 88%;

      max-width: 360px;

      padding:
        2.5rem
        1.75rem;

      border-radius: 28px;

      text-align: center;

      opacity: 0;

      transform:
        translateY(25px)
        scale(0.98);

      border:
        1px solid
        rgba(255,255,255,0.25);

      background:
        rgba(255,255,255,0.12);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:
        0 20px 70px
        rgba(0,0,0,0.22);

      transition:

        opacity .8s ease,

        transform .8s ease,

        filter .8s ease;
    }

    .password-card.in {

      opacity: 1;

      transform:
        translateY(0)
        scale(1);
    }

    .password-card.dissolving {

      opacity: 0;

      transform:
        scale(.96);

      filter:
        blur(14px);
    }


    /* PASSWORD TEXT */

    .eyebrow {

      margin: 0;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: .32em;

      color:
        rgba(255,255,255,.75);
    }

    .headline {

      margin:
        .7rem 0 .4rem;

      font-family:
        var(--font-display);

      font-size:
        2rem;

      font-style:
        italic;

      color:
        white;
    }

    .rose-emoji {

      display: block;

      font-size:
        1.7rem;

      margin-bottom:
        1.7rem;
    }


    /* DIGITS */

    .digits-wrap {

      position: relative;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 1rem;
    }

    #birthday-input {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      z-index: 4;

      opacity: 0;

      cursor: text;
    }

    .digit-boxes {

      display: flex;

      gap:
        .7rem;
    }

    .digit-box {

      width:
        45px;

      height:
        58px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius:
        13px;

      border:
        1px solid
        rgba(255,255,255,.35);

      background:
        rgba(255,255,255,.1);

      color:
        white;

      font-family:
        var(--font-display);

      font-size:
        1.7rem;

      transition:
        .3s;
    }

    .digit-box.filled {

      border-color:
        rgba(255,255,255,.9);
    }

    .digit-boxes.wrong .digit-box {

      border-color:
        #ffd9de;

      box-shadow:
        0 0 18px
        rgba(255,120,140,.7);
    }

    .digit-boxes.correct .digit-box {

      border-color:
        white;

      box-shadow:
        0 0 20px
        rgba(255,255,255,.6);
    }

    .digit-boxes.shake {

      animation:
        shake
        .55s
        ease-in-out;
    }

    @keyframes shake {

      0%,100% {
        transform:
          translateX(0);
      }

      20% {
        transform:
          translateX(-10px);
      }

      40% {
        transform:
          translateX(10px);
      }

      60% {
        transform:
          translateX(-7px);
      }

      80% {
        transform:
          translateX(7px);
      }

    }

    .hint {

      margin: 0;

      font-size:
        10px;

      letter-spacing:
        .25em;

      color:
        rgba(255,255,255,.7);
    }


    /* ============================================================
       BLACK TRANSITION
    ============================================================ */

    #stage-transition {

      background:
        var(--ink-black);
    }


    /* ============================================================
       VIDEO
    ============================================================ */

    #stage-video {

      background:
        var(--ink-black);
    }

    #rose-video {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit:
        cover;

      opacity: 0;

      transition:
        opacity
        1.1s ease;
    }

    #rose-video.visible {

      opacity: 1;
    }


    .video-glow {

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:

        radial-gradient(
          circle at 50% 60%,
          rgba(225,71,106,.18),
          transparent 55%
        ),

        radial-gradient(
          circle at 50% 50%,
          transparent 55%,
          rgba(0,0,0,.6) 100%
        );
    }


    /* ============================================================
       FINAL MESSAGE
    ============================================================ */

    #final-message {

      position: absolute;

      inset: 0;

      z-index: 5;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding:
        0 2rem;
    }

    .final-heart {

      font-size:
        2.3rem;

      opacity: 0;

      transform:
        scale(.3);

      transition:

        opacity .8s ease,

        transform .8s
        cubic-bezier(.34,1.56,.64,1);
    }

    .final-heart.visible {

      opacity: 1;

      transform:
        scale(1);

      animation:
        heartbeat
        1.4s
        infinite;
    }

    @keyframes heartbeat {

      0%,100% {
        transform:
          scale(1);
      }

      20% {
        transform:
          scale(1.18);
      }

      40% {
        transform:
          scale(.96);
      }

      60% {
        transform:
          scale(1.1);
      }

    }


    .final-wrap {

      display: flex;

      flex-direction: column;

      gap:
        .9rem;

      margin-top:
        1rem;
    }

    .final-wrap p {

      margin: 0;

      opacity: 0;

      transform:
        translateY(12px);

      transition:

        opacity 1.4s ease,

        transform 1.4s ease;
    }

    .final-wrap p.visible {

      opacity: 1;

      transform:
        translateY(0);
    }

    .final-line {

      font-family:
        var(--font-display);

      font-size:
        1.65rem;

      font-style:
        italic;

      color:
        var(--warm-white);
    }

    .final-attract {

      font-family:
        var(--font-display);

      font-style:
        italic;

      font-size:
        1.15rem;

      color:
        var(--rose-highlight);
    }

    .final-proposal {

      font-size:
        .9rem;

      color:
        rgba(255,255,255,.85);
    }


    /* NEXT BUTTON */

    .next-btn {

      margin-top:
        2rem;

      padding:
        .85rem
        2.5rem;

      border:
        none;

      border-radius:
        999px;

      background:

        linear-gradient(
          135deg,
          var(--rose-liquid),
          var(--rose-deep)
        );

      color:
        white;

      font-family:
        var(--font-body);

      cursor:
        pointer;

      opacity: 0;

      transform:
        translateY(10px);

      transition:
        1.2s;
    }

    .next-btn.visible {

      opacity: 1;

      transform:
        translateY(0);
    }


    /* ============================================================
       CHAT SCREEN
    ============================================================ */

    #stage-chat {

      background:
        var(--ink-black);

      align-items:
        center;

      justify-content:
        center;
    }

    #stage-chat.active {

      display:
        flex;
    }

    .chat-card {

      width:
        88%;

      max-width:
        360px;

      padding:
        2.5rem
        1.75rem;

      border-radius:
        28px;

      text-align:
        center;

      opacity: 0;

      transform:
        translateY(20px);

      border:
        1px solid
        rgba(255,255,255,.15);

      background:
        rgba(255,255,255,.06);

      backdrop-filter:
        blur(20px);

      transition:
        .9s ease;
    }

    .chat-card.in {

      opacity: 1;

      transform:
        translateY(0);
    }

    .chat-text {

      font-family:
        var(--font-display);

      font-style:
        italic;

      font-size:
        1.4rem;

      color:
        var(--warm-white);

      line-height:
        1.5;
    }

    .chat-buttons {

      display: flex;

      justify-content:
        center;

      gap:
        1rem;

      margin-top:
        1.8rem;
    }

    .btn-chat,
    .btn-exit {

      padding:
        .8rem
        1.7rem;

      border-radius:
        999px;

      font-family:
        var(--font-body);

      cursor:
        pointer;
    }

    .btn-chat {

      border:
        none;

      background:

        linear-gradient(
          135deg,
          var(--rose-liquid),
          var(--rose-deep)
        );

      color:
        white;
    }

    .btn-exit {

      background:
        transparent;

      color:
        rgba(255,255,255,.8);

      border:
        1px solid
        rgba(255,255,255,.3);
    }


    @media (prefers-reduced-motion: reduce) {

      * {

        animation-duration:
          .01ms !important;

        transition-duration:
          .01ms !important;
      }

    }

  </style>
</head>


<body>


<!-- ============================================================
     SCENE 1
     COUNTDOWN
============================================================ -->

<div
  class="stage active"
  id="stage-intro"
>

  <canvas
    id="countdown-canvas"
  ></canvas>

  <div
    class="countdown-glow"
  ></div>

</div>



<!-- ============================================================
     SCENE 2
     PASSWORD
============================================================ -->

<div
  class="stage"
  id="stage-password"
>

  <div
    id="particles"
  ></div>


  <div
    class="password-card"
    id="password-card"
  >

    <p
      class="eyebrow"
    >
      Before you enter my world…
    </p>


    <h1
      class="headline"
    >
      Enter your birthday
    </h1>


    <span
      class="rose-emoji"
    >
      🌹
    </span>


    <div
      class="digits-wrap"
    >

      <input
        id="birthday-input"
        type="tel"
        inputmode="numeric"
        maxlength="4"
      />


      <div
        class="digit-boxes"
        id="digit-boxes"
      >

        <div
          class="digit-box"
        ></div>

        <div
          class="digit-box"
        ></div>

        <div
          class="digit-box"
        ></div>

        <div
          class="digit-box"
        ></div>

      </div>


      <p
        class="hint"
      >
        DD &nbsp;&nbsp; MM
      </p>

    </div>

  </div>

</div>



<!-- ============================================================
     TRANSITION
============================================================ -->

<div
  class="stage"
  id="stage-transition"
></div>



<!-- ============================================================
     VIDEO
============================================================ -->

<div
  class="stage"
  id="stage-video"
>

  <!-- PUT YOUR VIDEO HERE -->

  <video
    id="rose-video"
    muted
    playsinline
    preload="auto"
    src="videos/rose-bloom.mp4"
  ></video>


  <div
    class="video-glow"
  ></div>


  <div
    id="final-message"
  >

    <div
      class="final-heart"
      id="final-heart"
    >
      💗
    </div>


    <div
      class="final-wrap"
    >

      <p
        class="final-line"
        id="final-line-1"
      ></p>

      <p
        class="final-line"
        id="final-line-2"
      ></p>

      <p
        class="final-attract"
        id="final-attract"
      ></p>

      <p
        class="final-proposal"
        id="final-proposal"
      ></p>

    </div>


    <button
      class="next-btn"
      id="next-btn"
    >
      Next
    </button>

  </div>

</div>



<!-- ============================================================
     CHAT
============================================================ -->

<div
  class="stage"
  id="stage-chat"
>

  <div
    class="chat-card"
    id="chat-card"
  >

    <p
      class="chat-text"
      id="chat-text"
    ></p>


    <div
      class="chat-buttons"
    >

      <button
        class="btn-chat"
        id="btn-chat"
      >
        Chat
      </button>


      <button
        class="btn-exit"
        id="btn-exit"
      >
        Exit
      </button>

    </div>

  </div>

</div>



<script>

(function () {

  'use strict';


  /* ============================================================
     EDIT THESE SETTINGS
  ============================================================ */


  var BIRTHDAY_CODE = '3101';


  var VIDEO_SRC =
    'videos/rose-bloom.mp4';


  var LINE_ONE =
    'Some things are worth waiting for…';


  var LINE_TWO =
    'And you are one of them. 🌹';


  var ATTRACT_LINE =
    'Rose, you are the softest kind of chaos my heart ever fell for.';


  var PROPOSAL_MESSAGE =
    'I have something special to tell you…';


  var CHAT_TEXT =
    'If you want to talk with me, message me 💬';


  var INSTAGRAM_URL =
    'https://www.instagram.com/unknown_me_6666';


  /* ============================================================ */


  var prefersReducedMotion =
    window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;


  var stages = {

    intro:
      document.getElementById(
        'stage-intro'
      ),

    password:
      document.getElementById(
        'stage-password'
      ),

    transition:
      document.getElementById(
        'stage-transition'
      ),

    video:
      document.getElementById(
        'stage-video'
      ),

    chat:
      document.getElementById(
        'stage-chat'
      )

  };


  function showStage(name) {

    Object.keys(stages).forEach(
      function (key) {

        stages[key]
          .classList
          .toggle(
            'active',
            key === name
          );

      }
    );

  }



  /* ============================================================
     COUNTDOWN PARTICLES
  ============================================================ */


  function runIntro() {

    var canvas =
      document.getElementById(
        'countdown-canvas'
      );


    var ctx =
      canvas.getContext('2d');


    var particles = [];


    function resize() {

      canvas.width =
        window.innerWidth;


      canvas.height =
        window.innerHeight;

    }


    resize();


    window.addEventListener(
      'resize',
      resize
    );



    function createParticles(number) {

      particles = [];


      var temp =
        document.createElement(
          'canvas'
        );


      var tctx =
        temp.getContext(
          '2d'
        );


      temp.width =
        window.innerWidth;


      temp.height =
        window.innerHeight;


      var size =
        Math.min(
          temp.width,
          temp.height
        ) * .48;


      tctx.font =
        'bold ' +
        size +
        'px Arial';


      tctx.textAlign =
        'center';


      tctx.textBaseline =
        'middle';


      tctx.fillStyle =
        'white';


      tctx.fillText(

        number,

        temp.width / 2,

        temp.height / 2

      );


      var data =
        tctx.getImageData(

          0,

          0,

          temp.width,

          temp.height

        ).data;


      var gap = 6;


      for (
        var y = 0;

        y < temp.height;

        y += gap
      ) {

        for (

          var x = 0;

          x < temp.width;

          x += gap

        ) {

          var index =
            (
              y *
              temp.width +
              x
            ) * 4;


          if (
            data[
              index + 3
            ] > 100
          ) {

            var angle =
              Math.random() *
              Math.PI *
              2;


            var distance =
              100 +
              Math.random() *
              220;


            particles.push({

              x:

                temp.width / 2 +

                Math.cos(angle) *
                distance,


              y:

                temp.height / 2 +

                Math.sin(angle) *
                distance,


              tx:
                x,


              ty:
                y,


              size:

                1 +
                Math.random() *
                2.5,


              speed:

                .035 +

                Math.random() *
                .035,


              opacity:
                0

            });

          }

        }

      }

    }



    function draw() {

      ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

      );


      particles.forEach(

        function (p) {

          ctx.beginPath();


          ctx.arc(

            p.x,

            p.y,

            p.size,

            0,

            Math.PI * 2

          );


          ctx.fillStyle =

            'rgba(225,71,106,' +

            p.opacity +

            ')';


          ctx.shadowBlur =
            15;


          ctx.shadowColor =
            '#ff7090';


          ctx.fill();


          ctx.shadowBlur =
            0;

        }

      );

    }



    function formNumber(callback) {

      var done =
        false;


      function animate() {

        var distance =
          0;


        particles.forEach(

          function (p) {

            var dx =
              p.tx -
              p.x;


            var dy =
              p.ty -
              p.y;


            p.x +=
              dx *
              p.speed;


            p.y +=
              dy *
              p.speed;


            p.opacity +=
              (1 -
              p.opacity) *
              .06;


            distance +=

              Math.abs(dx) +

              Math.abs(dy);

          }

        );


        draw();


        if (

          distance >

          particles.length *
          1.5

        ) {

          requestAnimationFrame(
            animate
          );

        }

        else if (!done) {

          done = true;


          setTimeout(

            callback,

            650

          );

        }

      }


      animate();

    }



    function explode(callback) {

      var start =
        performance.now();


      particles.forEach(

        function (p) {

          var angle =
            Math.random() *
            Math.PI *
            2;


          var speed =
            3 +
            Math.random() *
            9;


          p.vx =
            Math.cos(angle) *
            speed;


          p.vy =
            Math.sin(angle) *
            speed;

        }

      );


      function animation(time) {

        var progress =

          (time - start) /
          650;


        particles.forEach(

          function (p) {

            p.x +=
              p.vx;


            p.y +=
              p.vy;


            p.opacity =
              Math.max(

                0,

                1 -
                progress

              );

          }

        );


        draw();


        if (
          progress < 1
        ) {

          requestAnimationFrame(
            animation
          );

        }

        else {

          callback();

        }

      }


      requestAnimationFrame(
        animation
      );

    }



    function runNumber(
      number,
      next
    ) {

      createParticles(
        number
      );


      formNumber(

        function () {

          explode(

            function () {

              setTimeout(

                next,

                180

              );

            }

          );

        }

      );

    }



    runNumber(

      3,

      function () {

        runNumber(

          2,

          function () {

            runNumber(

              1,

              function () {

                showStage(
                  'password'
                );


                startPassword();

              }

            );

          }

        );

      }

    );

  }



  /* ============================================================
     PASSWORD
  ============================================================ */


  function startPassword() {

    var input =
      document.getElementById(
        'birthday-input'
      );


    var boxes =
      document.getElementById(
        'digit-boxes'
      );


    var boxEls =
      boxes.querySelectorAll(
        '.digit-box'
      );


    var card =
      document.getElementById(
        'password-card'
      );


    var locked =
      false;


    requestAnimationFrame(

      function () {

        card.classList.add(
          'in'
        );


        input.focus();

      }

    );


    function render(value) {

      for (

        var i = 0;

        i <
        boxEls.length;

        i++

      ) {

        boxEls[i]
          .textContent =
          value[i] ||
          '';


        boxEls[i]
          .classList
          .toggle(

            'filled',

            Boolean(
              value[i]
            )

          );

      }

    }



    input.addEventListener(

      'input',

      function () {

        if (
          locked
        ) return;


        var digits =

          input.value

          .replace(
            /\D/g,
            ''
          )

          .slice(
            0,
            4
          );


        input.value =
          digits;


        render(
          digits
        );


        if (
          digits.length < 4
        ) return;


        if (
          digits ===
          BIRTHDAY_CODE
        ) {

          locked =
            true;


          input.disabled =
            true;


          boxes.classList.add(
            'correct'
          );


          setTimeout(

            function () {

              card.classList.add(
                'dissolving'
              );


              stages.password
                .classList
                .add(
                  'unlocking'
                );


              setTimeout(

                function () {

                  showStage(
                    'transition'
                  );


                  setTimeout(

                    function () {

                      showStage(
                        'video'
                      );


                      runVideo();

                    },

                    350

                  );

                },

                900

              );

            },

            600

          );

        }

        else {

          locked =
            true;


          boxes.classList.add(
            'wrong'
          );


          boxes.classList.add(
            'shake'
          );


          setTimeout(

            function () {

              input.value =
                '';


              render(
                ''
              );


              boxes.classList.remove(
                'wrong'
              );


              boxes.classList.remove(
                'shake'
              );


              locked =
                false;


              input.focus();

            },

            700

          );

        }

      }

    );

  }



  /* ============================================================
     VIDEO
  ============================================================ */


  function runVideo() {

    var video =
      document.getElementById(
        'rose-video'
      );


    video.src =
      VIDEO_SRC;


    setTimeout(

      function () {

        video.classList.add(
          'visible'
        );


        video.play()
          .catch(
            function () {}
          );

      },

      400

    );


    video.onended =
      function () {

        setTimeout(

          showFinalMessage,

          1000

        );

      };

  }



  /* ============================================================
     FINAL MESSAGE
  ============================================================ */


  function showFinalMessage() {

    var heart =
      document.getElementById(
        'final-heart'
      );


    var line1 =
      document.getElementById(
        'final-line-1'
      );


    var line2 =
      document.getElementById(
        'final-line-2'
      );


    var attract =
      document.getElementById(
        'final-attract'
      );


    var proposal =
      document.getElementById(
        'final-proposal'
      );


    var next =
      document.getElementById(
        'next-btn'
      );


    line1.textContent =
      LINE_ONE;


    line2.textContent =
      LINE_TWO;


    attract.textContent =
      ATTRACT_LINE;


    proposal.textContent =
      PROPOSAL_MESSAGE;


    heart.classList.add(
      'visible'
    );


    setTimeout(
      function () {

        line1.classList.add(
          'visible'
        );

      },
      500
    );


    setTimeout(
      function () {

        line2.classList.add(
          'visible'
        );

      },
      1800
    );


    setTimeout(
      function () {

        attract.classList.add(
          'visible'
        );

      },
      3000
    );


    setTimeout(
      function () {

        proposal.classList.add(
          'visible'
        );

      },
      4300
    );


    setTimeout(
      function () {

        next.classList.add(
          'visible'
        );

      },
      5500
    );

  }



  /* ============================================================
     CHAT
  ============================================================ */


  document
    .getElementById(
      'next-btn'
    )

    .addEventListener(

      'click',

      function () {

        showStage(
          'chat'
        );


        var card =
          document.getElementById(
            'chat-card'
          );


        var text =
          document.getElementById(
            'chat-text'
          );


        text.textContent =
          CHAT_TEXT;


        requestAnimationFrame(

          function () {

            card.classList.add(
              'in'
            );

          }

        );

      }

    );



  document
    .getElementById(
      'btn-chat'
    )

    .addEventListener(

      'click',

      function () {

        window.location.href =
          INSTAGRAM_URL;

      }

    );



  document
    .getElementById(
      'btn-exit'
    )

    .addEventListener(

      'click',

      function () {

        document
          .getElementById(
            'chat-text'
          )

          .textContent =

          "Don't you like me? 🥺";

      }

    );



  /* ============================================================
     START WEBSITE
  ============================================================ */


  runIntro();


})();

</script>

</body>
</html>
